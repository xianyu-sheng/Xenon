[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xenon-harness"
dynamic = ["version"]
description = "Xenon: Agent Harness for running, constraining, and evaluating AI coding agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "xianyu-sheng"},
]
keywords = ["ai", "coding-assistant", "cli", "deepseek", "react", "agent", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Terminals",
]
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0",
    "jedi>=0.19.0",
    "tiktoken>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/xianyu-sheng/Xenon"
Repository = "https://github.com/xianyu-sheng/Xenon"
Issues = "https://github.com/xianyu-sheng/Xenon/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.0",
    # 不再钉死 Ruff 上限；版本单一来源是 xenon/__init__.py 的 __version__。
    "ruff>=0.16.10",
]
clipboard = [
    # clipboard_monitor 的懒加载依赖（未安装时该功能友好降级）
    "pynput",
    "Pillow",
]
office = [
    "xlrd>=2.0",
    "pypdf>=4.0",
]

[project.scripts]
xenon = "xenon.main:cli"

[tool.pytest.ini_options]
norecursedirs = ["build", "evals/fixtures"]
markers = [
    "live: requires external network access or real provider credentials",
    "e2e: deterministic end-to-end CLI workflow",
]

[tool.ruff]
target-version = "py310"

# 钉死的是规则合同而非工具版本：ruff 版本可自由升级，
# 规则集固定为 E4/E7/E9/F + I + B（#127 phase 1：isort；phase 2：bugbear），
# 避免上游默认集变动引发噪声；规则合同由 tests/test_lint_contract.py 冻结。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.coverage.run]
source = ["xenon"]
omit = []

[tool.setuptools.dynamic]
version = {attr = "xenon.__version__"}

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.setuptools.packages.find]
include = ["xenon*"]
exclude = ["xenon.tests", "xenon.tests.*"]
