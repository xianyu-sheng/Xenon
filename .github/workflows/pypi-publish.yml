name: Publish to PyPI

# 仅手动触发：用户决定暂不发布 PyPI（GitHub Releases 已挂 wheel，
# 安装路径足够）。将来想发时：建项目 + 配 Trusted Publisher，再把
# `push: tags: ["v*"]` 加回来；版本一致性校验步骤已就绪。
on:
  workflow_dispatch:

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # PyPI Trusted Publisher (OIDC)
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Verify tag matches package version
        run: |
          python -c "import os,sys,xenon; t=os.environ['GITHUB_REF_NAME'].lstrip('v'); sys.exit(0 if xenon.__version__==t else f'tag {t} != version {xenon.__version__}')"

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
