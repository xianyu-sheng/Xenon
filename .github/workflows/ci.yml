name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      XENON_ASSUME_YES: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Syntax check
        run: python -m compileall -q xenon tests

      - name: Ruff
        run: ruff check xenon tests evals scripts

      - name: Kernel purity guard
        run: python scripts/check_kernel_purity.py

      - name: Engine-skeleton ratchet
        run: python scripts/check_engine_imports.py

      # Documentation that points at deleted files is a defect, not a typo.
      - name: Docs reference guard
        run: python scripts/check_docs_refs.py

      - name: Offline tests + coverage
        run: |
          python -m pytest tests \
            -m "not live and not e2e" \
            -q --tb=short \
            --cov=xenon \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            --timeout=120 \
            --no-header

      # Coverage is merged (--cov-append) so the CLI entry paths exercised only
      # by the e2e suite land in the upload instead of being discarded.
      # Nine adversarial cases: the harness must stop them.  Runs on a fake
      # model by design (it tests the harness, not a provider).
      - name: False-completion benchmark (9 cases)
        run: python -m evals.false_completion

      # Replay/metrics read a committed ledger: no model, no network, same
      # output every run.  If this breaks, post-mortem capability is gone.
      - name: Replay + metrics smoke (deterministic)
        run: |
          python -m xenon metrics docs/evidence/eval-kernel-runner/ledger.jsonl
          python -m xenon replay docs/evidence/child-runtime/ledger.jsonl | head -20

      - name: Deterministic CLI end-to-end + merged coverage
        run: |
          python -m pytest tests/e2e -m e2e \
            -q --tb=short --timeout=60 \
            --cov=xenon --cov-append --cov-report=xml

      # The same component targets codecov.yml declares, checked in CI so they
      # cannot silently drift while the dashboard stays green.
      - name: Component coverage gate
        run: python scripts/cov_components.py coverage.xml

      # Codecov's patch status only speaks after a push.  This asks the same
      # question locally: which *added* lines did this diff execute?  Kept at 90%
      # (Codecov's own target is ~80) so it tightens rather than weakens, without
      # blocking a PR over one uncovered branch.
      - name: Patch coverage gate (diff lines only)
        if: github.event_name == 'pull_request'
        run: |
          # A PR checkout is shallow and has no local `origin/<base>` ref, so
          # the merge base has to be fetched explicitly before diffing.
          git fetch --no-tags --depth=200 origin             "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          python scripts/patch_cov.py --from-xml --threshold 90             --base "origin/${{ github.base_ref }}"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        if: always() && matrix.python-version == '3.12'

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and verify distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

  platform-smoke:
    name: Platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dev package
        run: python -m pip install -e ".[dev]"

      - name: Import and compile smoke test
        run: |
          python -c "import xenon; print(xenon.__version__)"
          python -m compileall -q xenon

      - name: CLI version smoke test
        run: xenon --version

      # Bounded, platform-sensitive subset on all three OSes (paths, GBK,
      # quoting, limits). Linux keeps the full suite in the test job above;
      # this leg is about platform coverage, not exhaustiveness.
      - name: Platform test subset
        run: >-
          python -m pytest tests/test_public_api.py tests/test_b1_command_quoted.py
          tests/test_turn_routing.py tests/test_child_runtime.py
          -q --timeout=120 -p no:cacheprovider
