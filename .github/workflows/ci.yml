name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      XENON_ASSUME_YES: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Syntax check
        run: python -m compileall -q xenon tests

      - name: Ruff
        run: ruff check xenon tests evals

      - name: Kernel purity guard
        run: python scripts/check_kernel_purity.py

      - name: Engine-skeleton ratchet
        run: python scripts/check_engine_imports.py

      - name: Offline tests + coverage
        run: |
          python -m pytest tests \
            -m "not live and not e2e" \
            -q --tb=short \
            --cov=xenon \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            --timeout=120 \
            --no-header

      # Coverage is merged (--cov-append) so the CLI entry paths exercised only
      # by the e2e suite land in the upload instead of being discarded.
      - name: Deterministic CLI end-to-end + merged coverage
        run: |
          python -m pytest tests/e2e -m e2e \
            -q --tb=short --timeout=60 \
            --cov=xenon --cov-append --cov-report=xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        if: always() && matrix.python-version == '3.12'

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and verify distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

  platform-smoke:
    name: Platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dev package
        run: python -m pip install -e ".[dev]"

      - name: Import and compile smoke test
        run: |
          python -c "import xenon; print(xenon.__version__)"
          python -m compileall -q xenon

      - name: CLI version smoke test
        run: xenon --version

      # Bounded, platform-sensitive subset on all three OSes (paths, GBK,
      # quoting, limits). Linux keeps the full suite in the test job above;
      # this leg is about platform coverage, not exhaustiveness.
      - name: Platform test subset
        run: >-
          python -m pytest tests/test_public_api.py tests/test_b1_command_quoted.py
          tests/test_truncation_and_limits.py -q --timeout=120 -p no:cacheprovider
